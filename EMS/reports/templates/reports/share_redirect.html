<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<title>Redirecting...</title>
<script>window.open('{{ share_url }}', '_blank'); window.history.back();</script>
</head>
<body>
<div style="font-family: sans-serif; text-align: center; padding: 40px;">
    <h2>Sharing via {{ via|title }}</h2>
    <p>If the app doesn't open automatically, <a href="{{ share_url }}" target="_blank">click here</a>.</p>
    <hr>
    <h3>Report Preview:</h3>
    <pre style="text-align: left; background: #f5f5f5; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; white-space: pre-wrap;">{{ text }}</pre>
    <br>
    <a href="javascript:window.history.back()">← Go Back</a>
</div>
</body>
</html>
